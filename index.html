<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Pociones Mágico</title>
    <style>
        /* Fondo inspirado en un caldero o castillo */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1a1a2e;
            background-image: radial-gradient(circle, #2e2e4e 0%, #1a1a2e 100%);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
            font-size: 3em;
            margin-bottom: 10px;
        }

        /* Botones estilo medieval/mágico */
        button {
            padding: 12px 25px;
            margin: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            border: 2px solid #ffd700;
            background: #333;
            color: #ffd700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        button:hover {
            background: #ffd700;
            color: #1a1a2e;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        /* Contenedor tipo pergamino */
        #contenido {
            margin-top: 30px;
            padding: 40px;
            border: 15px solid #3d2b1f; /* Marco de madera */
            width: 70%;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            background-color: #f4e4bc; /* Color pergamino */
            background-image: url('https://www.transparenttextures.com/patterns/aged-paper.png');
            color: #2d1e12;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 5px;
            min-height: 200px;
        }

        h2, h3 {
            font-family: 'Georgia', serif;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 5px;
        }

        /* Estilo para que las listas se vean centradas pero alineadas */
        .seccion-receta {
            display: inline-block;
            text-align: left;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }

        ul, ol {
            margin: 10px 0;
            padding-left: 20px;
            line-height: 1.6;
        }

        .ingredientes li {
            list-style-type: "✦ ";
            margin-bottom: 5px;
        }

        .volver-btn {
            background: #8b0000;
            color: white;
            border-color: #5a0000;
        }

        .volver-btn:hover {
            background: #ff4500;
            color: white;
        }
    </style>
</head>
<body>

    <h1>🧪 Libro de Pociones</h1>

    <div id="cursos">
        <button onclick="mostrarCurso(4)">4 Año</button>
        <button onclick="mostrarCurso(5)">5 Año</button>
        <button onclick="mostrarCurso(6)">6 Año</button>
        <button onclick="mostrarCurso(7)">7 Año</button>
    </div>

    <div id="contenido">
        <p><i>Selecciona un curso para abrir el libro...</i></p>
    </div>

    <script>
    const datos = {
        4: {
            "Poción Oculus": {
                ingredientes: ["Ajenjo", "Mandrágora", "Cuerno de Unicornio", "Lágrima de moonclaf"],
                tratamiento: ["Cortar el ajenjo", "Cocinar la mandrágora", "Moler el cuerno de unicornio"],
                pasos: ["Encender el fuego", "Añadir la base", "Mezcla a 100°C", "Añadir ajenjo", "Añadir mandrágora", "Remover 3 veces anti-horario", "Añadir polvo de unicornio", "Remover horario", "Añadir lágrima", "Remover 2 veces anti-horario", "Apagar fuego"]
            },
            "Poción Calmante": {
                ingredientes: ["Púas de knarl", "Lavanda", "Camomila", "Solución para el dolor de cabeza"],
                tratamiento: ["Moler las púas", "Cortar la lavanda", "Cortar camomila"],
                pasos: ["Encender el fuego", "Añadir la base", "Mezcla a 120°C", "Añadir el polvo de púas", "Remover en sentido horario", "Añadir lavanda y camomila", "Añadir solución", "Remover derecha", "Apagar el fuego"]
            },
            "Poción de Hielo": {
                ingredientes: ["Fruto de arbustos de fuego", "Huevo de Ashwinder", "Polvo verrugoso", "Sangre de salamandra"],
                tratamiento: ["Moler frutos", "Moler polvo verrugoso"],
                pasos: ["Encender el fuego", "Añadir base","Calentar la base a 30°C", "Añadir el polvo defrutos", "Remover en sentido horario", "Añadir la cáscara de huevo", "Remover a la izquierda", "Añadir el polvo verrugoso", "Añadir la sangre de salamandra", "Remover en sentido anti-horario", "Apagar"]
            },
            "Poción Volubilis": {
                ingredientes: ["Narcisos pitantes", "Pétalo de rosas", "Jarabe de eléboro", "Aguamiel", "Rama de menta", "Pluma de flopper", "Mandrágora"],
                tratamiento: ["Cortar narcisos", "Cortar rosa", "Moler menta"],
                pasos: ["Endencer el fuego","Añadir la base(Alcohol)","Calentar la base a 45°C", "Añadir narciso y rosa", "Remover 2 veces horario", "Añadir el eléboro y aguamiel", "Remover 3 veces derecha", "Añadir pasta de menta", "Remover 2 veces izquierda", "Añadir pluma de flooper", "Añadir mandrágora cocida","Apagar el fuego"]
            }
        },
        5: {
            "Poción regeneradora de sangre": {
                ingredientes: ["Malvadulce","Ajenjo","Mandrágora","Sanguijuela","Sangre de salamandra"],
                tratamiento: ["Cortar malvadulce","Cortar ajenjo en trozos","Cocinar la mandrágora"],
          pasos: ["Encender el fuego","Añadir la base","Calentar la agua a 40°","Añadir la malva en trozos","Remover 2 veces en sentido horarios","Añadir trozos de ajenjo y mandrágora cocida","Remover 2 veces en sentido anti","Añadir sanguijuelas y sangre de salamandra","Remover derecha","Bajar el fuego a 35°","Apagar el fuego"]
                }
        }, 6: {}, 7: {}
    };

    function mostrarCurso(curso) {
        let html = `<h2>📜 Pociones de ${curso}º Año</h2>`;
        let lista = datos[curso];

        if (Object.keys(lista).length === 0) {
            html += "<p>Este capítulo está en blanco. Aún no has aprendido estas pociones.</p>";
        } else {
            for (let nombre in lista) {
                html += `<button onclick="mostrarReceta(${curso}, '${nombre}')">${nombre}</button><br>`;
            }
        }
        html += `<br><button class="volver-btn" onclick="volverCursos()">Cerrar Libro</button>`;
        document.getElementById("contenido").innerHTML = html;
    }

    function mostrarReceta(curso, nombre) {
        let receta = datos[curso][nombre];
        let html = `<h2>${nombre}</h2>`;

        html += `<div class="seccion-receta"><h3>🌿 Ingredientes</h3><ul>`;
        receta.ingredientes.forEach(i => html += `<li>${i}</li>`);
        html += `</ul></div>`;

        html += `<div class="seccion-receta"><h3>🔪 Tratamiento</h3><ul>`;
        receta.tratamiento.forEach(t => html += `<li>${t}</li>`);
        html += `</ul></div>`;

        html += `<div class="seccion-receta"><h3>🔥 Modo de preparación</h3><ol>`;
        receta.pasos.forEach(p => html += `<li>${p}</li>`);
        html += `</ol></div>`;

        html += `<br><button class="volver-btn" onclick="mostrarCurso(${curso})">⬅ Volver al Índice</button>`;
        document.getElementById("contenido").innerHTML = html;
    }

    function volverCursos() {
        document.getElementById("contenido").innerHTML = "<p><i>Selecciona un curso para abrir el libro...</i></p>";
    }
    </script>
</body>
</html>
