<!DOCTYPE html> 
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Libro de Pociones</title>

<style>
body{
    font-family: Arial;
    text-align: center;
    background-color: #eef3ff;
}

button{
    padding: 10px 20px;
    margin: 8px;
    font-size: 16px;
    cursor: pointer;
}

#contenido{
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #aaa;
    width: 60%;
    margin-left: auto;
    margin-right: auto;
    background: white;
}
</style>
</head>

<body>

<h1>🧪 Libro de Pociones</h1>

<div id="cursos">
    <h2>Selecciona el curso</h2>
    <button onclick="mostrarCurso(4)">Curso 4</button>
    <button onclick="mostrarCurso(5)">Curso 5</button>
    <button onclick="mostrarCurso(6)">Curso 6</button>
    <button onclick="mostrarCurso(7)">Curso 7</button>
</div>

<div id="contenido"></div>

<script>

const datos = {
4: {
    "Poción de Curación": {
        ingredientes: ["2 hojas mágicas", "Agua pura", "3 gotas rojas"],
        pasos: ["Calentar agua", "Añadir hojas", "Agregar gotas", "Mezclar 3 minutos"]
    },
    "Poción de Energía": {
        ingredientes: ["Raíz amarilla", "Polvo brillante"],
        pasos: ["Mezclar ingredientes", "Agitar fuerte"]
    }
},
5: {
    "Poción de Fuerza": {
        ingredientes: ["Escama mágica", "Extracto verde"],
        pasos: ["Hervir", "Remover lentamente"]
    }
},
6: {},
7: {}
};

function mostrarCurso(curso){
    let html = "<h2>Pociones del Curso " + curso + "</h2>";

    for(let pocion in datos[curso]){
        html += `<button onclick="mostrarReceta(${curso}, '${pocion}')">${pocion}</button><br>`;
    }

    html += `<br><button onclick="volverCursos()">⬅ Volver</button>`;

    document.getElementById("contenido").innerHTML = html;
}

function mostrarReceta(curso, pocion){
    let receta = datos[curso][pocion];

    let html = `<h2>${pocion}</h2>`;
    
    html += "<h3>Ingredientes</h3><ul>";
    receta.ingredientes.forEach(i => {
        html += "<li>" + i + "</li>";
    });
    html += "</ul>";

    html += "<h3>Pasos</h3><ol>";
    receta.pasos.forEach(p => {
        html += "<li>" + p + "</li>";
    });
    html += "</ol>";

    html += `<button onclick="mostrarCurso(${curso})">⬅ Volver al curso</button>`;

    document.getElementById("contenido").innerHTML = html;
}

function volverCursos(){
    document.getElementById("contenido").innerHTML = "";
}

</script>

</body>
</html>
