<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libro de Pociones</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eef3ff;
        }
        button {
            padding: 10px 20px;
            margin: 8px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button:hover {
            background-color: #ddd;
        }
        #contenido {
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #aaa;
            width: 60%;
            margin-left: auto;
            margin-right: auto;
            background: white;
            min-height: 100px;
        }
        /* Centrar el contenedor principal */
#contenido {
    margin-top: 20px;
    padding: 20px;
    border: 1px solid #aaa;
    width: 60%;
    margin-left: auto;
    margin-right: auto;
    background: white;
    text-align: center; /* Esto centra los títulos H2, H3 y botones */
}

/* Estilo para las listas (ingredientes y pasos) */
.ingredientes, .pasos {
    display: inline-block; /* Permite que el bloque se comporte como texto para centrarlo */
    text-align: left;      /* El texto interno de la lista se alinea a la izquierda */
    margin: 10px auto;     /* Centra el bloque de la lista en la página */
    width: fit-content;    /* El ancho se ajusta al texto más largo */
    min-width: 250px;      /* Evita que se vea muy estrecho en móviles */
}

.ingredientes {
    list-style: none;      /* Sin puntos para ingredientes */
    padding-left: 0;
}

.pasos {
    list-style-position: inside; /* Los números quedan alineados con el texto */
    padding-left: 0;
}
        
    </style>
</head>
<body>

    <h1>🧪 Libro de Pociones</h1>

    <div id="cursos">
        <h2>Selecciona el curso</h2>
        <button onclick="mostrarCurso(4)">Curso 4</button>
        <button onclick="mostrarCurso(5)">Curso 5</button>
        <button onclick="mostrarCurso(6)">Curso 6</button>
        <button onclick="mostrarCurso(7)">Curso 7</button>
    </div>

    <div id="contenido">

    </div>

    <script>
     // Objeto de datos corregido con todas sus llaves en su sitio
const datos = {
    4: {
        "Poción oculus": {
            ingredientes: ["Ajenjo", "Mandrágora", "Cuerno de Unicornio", "Lágrima de moonclaf"],
            tratamiento: ["Cortar el ajenjo", "Cocinar la mandrágora", "Moler el cuerno de unicornio"],
            pasos: [" Encender el fuego", " Añadir la base ", " Poner la mezcla a 100°", " Añadir ajenjo en trozos", " Añadir mandrágora cocida", " Remover 3 veces en sentido anti-horario", " Añadir el polvo de unicornio", " Remover en sentido horario", " Añadir la lágrima de moonclaf", " Remover 2 veces en sentido anti", " Apagar el fuego"]
        },
        "Poción calmante": {
            ingredientes: ["Púas de knarl", "Lavanda", "Camomila", "Solución para el dolor de cabeza"],
            tratamiento: ["Moler las púas", "Cortar la lavanda", "Cortar camomila"],
            pasos: [" Encender el fuego", " Añadir la base", " Poner la mezcla a 120°", " Añadir el polvo de púas", " Remover en sentido horario", " Añadir lavanda y camomila en trozos", " Añadir la solución", " Remover derecha", " Apagar fuego"]
        }
        "Poción de hielo": {
     ingredientes: ["Fruto de arbustos de fuego","Cáscara de huevo de Ashwinder","Polvo verrugoso","Sangre de salamandra","Vainilla de viento"],
    tratamiento: ["Moler los frutos de arbusto de fuego","Moler el polvo verrugoso"],
         pasos: ["Encender el fuego","Añadir la base(alcohol)","Poner el fuego a 30°","Añadir el polvo de frutos","Remover en sentido horario","Añadir cáscaras de ashwinder","Remover izquierda","Añadir polvo verrugoso","Añadir sangre de salamandra","Remover en sentido anti-horario","Añadir vainilla de viento","Apagar el fuego"]
        }
        "Poción volubilis": {
        ingredientes: ["Narciso pitantes","Pétalo de rosas","Jarabe de eléboro","Aguamiel","Pasta de menta","Pluma de flopper","Mandrágora cocida"],
        ingredientes: [" ]
    },
    5:{},
    6:{},
    7:{}
};

function mostrarCurso(curso) {
    let html = "<h2>Pociones del Curso " + curso + "</h2>";
    
    // Obtenemos las pociones del curso seleccionado
    let listaPociones = datos[curso];

    if (Object.keys(listaPociones).length === 0) {
        html += "<p>No hay recetas en este curso todavía.</p>";
    } else {
        for (let nombrePocion in listaPociones) {
            html += `<button onclick="mostrarReceta(${curso}, '${nombrePocion}')">${nombrePocion}</button><br>`;
        }
    }

    html += `<br><button onclick="volverCursos()">⬅ Volver</button>`;
    document.getElementById("contenido").innerHTML = html;
}

function mostrarReceta(curso, nombrePocion) {
    let receta = datos[curso][nombrePocion];
    let html = `<h2>${nombrePocion}</h2>`;

    html += "<h3>Ingredientes</h3><ul class='ingredientes'>";
    receta.ingredientes.forEach(i => {
        html += "<li>" + i + "</li>";
    });
    html += "</ul>"; // <-- Aquí estaba el error (línea 108 aprox)

    html += "<h3>Tratamiento</h3><ul class='ingredientes'>";
    receta.tratamiento.forEach(t => {
        html += "<li>" + t + "</li>";
    });
    html += "</ul>";

    html += "<h3>Pasos</h3><ol class='pasos'>";
    receta.pasos.forEach(p => {
        html += "<li>" + p + "</li>";
    });
    html += "</ol>";

    html += `<button onclick="mostrarCurso(${curso})">⬅ Volver al curso</button>`;
    document.getElementById("contenido").innerHTML = html;
}

function volverCursos() {
    document.getElementById("contenido").innerHTML = "";
}
    </script>

</body>
</html>
